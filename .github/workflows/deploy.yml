name: Deploy PatternQuest

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Upload sources
        run: |
          rsync -avz -e "ssh -i ~/.ssh/deploy_key" \
            --include='package.json' \
            --include='packages/***' \
            --exclude='node_modules' \
            --exclude='.git' \
            . root@${{ secrets.VPS_HOST }}:/opt/cheslav/patternquest/

      - name: Build and restart
        run: |
          ssh -i ~/.ssh/deploy_key root@${{ secrets.VPS_HOST }} << 'EOF'
          cd /opt/cheslav/patternquest
          docker build --no-cache -t patternquest .
          docker rm -f cheslav-patternquest 2>/dev/null
          docker run -d \
            --name cheslav-patternquest \
            --network cheslav-net \
            --restart unless-stopped \
            patternquest
          sleep 3
          docker logs cheslav-patternquest 2>&1 | tail -5
          EOF
